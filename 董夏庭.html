    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: slategray;
            color: white;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        header {
            text-align: center;
            padding: 2rem 1rem 1.5rem;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: white;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #E0E0E0;
        }

        main {
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .indexgrid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
        }

        .cell {
            text-align: center;
            text-decoration: none;
            color: inherit;
            width: 240px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .cell:hover {
            transform: scale(1.05);
            z-index: 10;
        }

        .celltitle {
            font-family: 'Orbitron', sans-serif;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
            display: block;
        }

        .cell:hover .celltitle {
            color: aqua;
        }

        .cellimg {
            width: 100%;
            max-width: 200px;
            height: 300px;
            object-fit: cover;
            object-position: top;
            border: 4px solid black;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        footer {
            background-color: black;
            color: lime;
            text-align: center;
            padding: 1.2rem 1rem;
            font-family: 'Orbitron', sans-serif;
        }

        footer a {
            color: aqua;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media screen and (max-width: 768px) {
            .indexgrid { gap: 1.8rem; }
            .cellimg { height: 270px; }
        }

        @media screen and (max-width: 480px) {
            .cell { width: 100%; max-width: 280px; }
            .cellimg { max-width: 220px; height: 290px; }
        }
    </style>
    <style>
._topbar{position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;justify-content:center;align-items:center;background:rgba(10,10,10,0.96);padding:0.45rem 1.5rem;box-shadow:0 1px 0 rgba(255,255,255,0.06);}
._langrow{display:flex;gap:0.4rem;flex-wrap:wrap;justify-content:center;}

._topbar a._langbtn:hover{opacity:0.85;}
@media print{._topbar{display:none!important;}}

</head>
