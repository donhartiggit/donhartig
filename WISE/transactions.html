<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VISE • Transactions</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --wise-green: #ace683;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0F0F0F;
            color: #EEE;             
            margin: 0 auto;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Sets the color for all link states: unvisited, visited, hover, and active */
        a, a:visited {
            color: #ace683;
            text-decoration: none;
        }

        .phone-frame {
            background: #0F0F0F;
            border: 14px solid #111;
            border-radius: 52px;
            height: 100vh;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        /* Status Bar */
        .status-bar {
            height: 48px;
            background: #0F0F0F;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 13px;
            color: #CCC;
        }

        /* Top Navigation */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px 20px 20px; /* Slightly reduced bottom padding to lift icons */
            background: #0F0F0F;
        }

        .top-icons {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .icon-btn {
            width: 56px;
            height: 56px;
            background: #1C1C1C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-btn img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        .transactions-title {
            font-size: 30px;
            font-weight: 600;
            margin-left: 20px;
            margin-top: 4px; /* Slight offset to make icons appear higher */
        }

         /* Filters */
        .filters {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .filter-btn {
            background: #1C1C1C;
            color: #ace683;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #333;
        }

        .filter-btn.active {
            background: var(--wise-green);
            color: #000;
            border-color: var(--wise-green);
        }

        /* Date Groups */
        .date-group {
            padding: 20px 20px 8px;
            font-size: 13px;
            color: white;
            font-weight: 100;
        }

        .transaction {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-top: 1px solid #222;
        }

        .trans-icon {
            width: 48px;
            height: 48px;
            border: 2px solid #312F2F;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-right: 16px;
            color: white;
        }

        .trans-info {
            flex: 1;
        }

        .trans-name {
            font-weight: 600;
            font-size: 16.5px;
        }

        .trans-subtitle {
            font-size: 12px;
            color: white;
        }

        .trans-amount {
            text-align: right;
            font-weight: 600;
            font-size: 16px;
        }

        /* Toy Disclaimer */
        .toy-footer {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 60, 60, 0.95);
            color: white;
            font-size: 11px;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <!-- Left: Cross icon -->
        <div class="top-icons">
            <div class="icon-btn">
                <a href="WISEWeb.html"><span style="width:676; height:100%;"><img src="icons/cross.png" alt="close"></span></a>
            </div>
        </div>

        <!-- Right icons: Search and Chart -->
        <div class="top-icons">
            <div class="icon-btn"><img src="icons/search.png" alt="search"></div>
            <div class="icon-btn"><img src="icons/chart.png" alt="chart"></div>
        </div>
    </div>

    <div class="transactions-title">Transactions</div>

    <!-- Filters -->
    <div class="filters">
        <div class="filter-btn">Include hidden</div>
        <div class="filter-btn">Type</div>
        <div class="filter-btn">Currency</div>
        <div class="filter-btn">Direction</div>
    </div>

    <!-- Transactions List -->
    <div class="date-group">Sunday, 05 April</div>
    <div class="transaction">
        <div class="trans-icon">↑</div>
        <div class="trans-info">
            <div class="trans-name">JOLLY EARTH LTD</div>
            <div class="trans-subtitle">Sent</div>
        </div>
        <div class="trans-amount">760 USD</div>
    </div>

    <div class="date-group">24 March</div>
    <div class="transaction">
        <div class="trans-icon">↑</div>
        <div class="trans-info">
            <div class="trans-name">JOLLY EARTH LTD</div>
            <div class="trans-subtitle">Sent</div>
        </div>
        <div class="trans-amount">1 240 USD</div>
    </div>

    <div class="date-group">17 October 2025</div>
    <div class="transaction">
        <div class="trans-icon">↑</div>
        <div class="trans-info">
            <div class="trans-name">Ying Chao Ji</div>
            <div class="trans-subtitle">Sent</div>
        </div>
        <div class="trans-amount">
            3 551,85 CNY<br>
            <span style="font-size:13px;color:white;">500 USD</span>
        </div>
    </div>

    <div class="transaction">
        <div class="trans-icon">↑</div>
        <div class="trans-info">
            <div class="trans-name">Ying Chao Ji</div>
            <div class="trans-subtitle">Sent</div>
        </div>
        <div class="trans-amount">
            8 657,25 CNY<br>
            <span style="font-size:13px;color:white;">1 219,28 USD</span>
        </div>
    </div>

    <div class="date-group">21 October 2024</div>
    <div class="transaction">
        <div class="trans-icon">↑</div>
        <div class="trans-info">
            <div class="trans-name">Ying Chao Ji</div>
            <div class="trans-subtitle">Sent</div>
        </div>
        <div class="trans-amount">1 200 USD</div>
    </div> 

</body>
</html>
