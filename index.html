<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="MC-COEEIzavbIoTHTt6DkGeQp29IBH4Kg4PiQFxEFmo">
    <title>Don Hartig CV</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Aldrich&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: slategray;
            color: white;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }
        header {
            text-align: center;
            padding: 2rem 1rem 1.5rem;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: black;
            margin-bottom: 0.5rem;
        }
        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: black;
        }
        main {
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }
        .indexgrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
            justify-items: center;
        }
        .cell {
            text-align: center;
            text-decoration: none;
            color: inherit;
        }
        .celltitle {
            font-family: 'Orbitron', sans-serif;
            color: blue;
            font-size: 1.3rem;
            margin-bottom: 1rem;
            display: block;
        }
        .cellimg {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border: 4px solid black;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        footer {
            background-color: black;
            color: lime;
            text-align: center;
            padding: 1.2rem 1rem;
            font-family: 'Orbitron', sans-serif;
        }
        footer a {
            color: aqua;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        /* Small mobile adjustment */
        @media screen and (max-width: 320px) {
            .cellimg {
                width: 180px;
                height: 270px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><u>Don Hartig</u></h1>
        <h2>CVs &amp; Portfolios</h2>
    </header>
    <main>
        <div class="indexgrid">
            <!-- Original image paths restored -->
            <a href="localisation.html" class="cell">
                <span class="celltitle">Localisation</span>
                <img src="Brown-rem.jpg" alt="Localisation Portfolio" class="cellimg">
            </a>
            <a href="marketing.html" class="cell">
                <span class="celltitle">Marketing</span>
                <img src="broodingdon.jpg" alt="General CV" class="cellimg">
            </a>
        </div>
    </main>
    <footer>
        <p>Coded by <a href="https://www.donhartig.com">Don Hartig</a></p>
    </footer>
</body>
</html>
